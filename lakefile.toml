# APKAXIOM Lake project — P1.2 bring-up.
#
# Hermeticity model:
#   * `lean-toolchain` pins Lean (matches `flake.nix` `pkgsUnstable.lean4`).
#   * `lake-manifest.json` (committed) pins every transitive dep by content
#     hash. `lake update` regenerates it; CI's reindeer-style
#     idempotence-check asserts no PR mutates the manifest by surprise.
#   * mathlib4 is fetched at the v4.29.1 tag (commit 5e932f97dd25); the
#     Lean Reservoir public cache supplies prebuilt .olean files so cold
#     CI runs land inside the 10-minute budget.

name = "apkaxiom"
defaultTargets = ["Apkaxiom"]
packagesDir = ".lake/packages"
srcDir = "theorems"

[leanOptions]
pp.unicode.fun = true        # nicer pretty-printing for tactic state

[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.29.1"

[[lean_lib]]
name = "Apkaxiom"
defaultFacets = ["leanArts"]

# P1.9 — LFH evaluator binary used by the translation-validator.
# Reads hex-encoded LFH inputs on stdin, runs `parseLfh` on each,
# emits one JSON-line per input on stdout.
[[lean_exe]]
name = "lfh-eval"
root = "Apkaxiom.Tv.LfhEval"
supportInterpreter = true

# P1.9 §IV — EOCD evaluator binary used by the translation-validator.
# Reads hex-encoded EOCD inputs on stdin, runs `parseEocd` on each,
# emits one stable JSON-line per input on stdout.
[[lean_exe]]
name = "eocd-eval"
root = "Apkaxiom.Tv.EocdEval"
supportInterpreter = true

# P1.11 — APK signing-block evaluator binary used by the
# translation-validator. Reads hex-encoded APK bytes on stdin
# (one APK per line), runs `Apkaxiom.Signing.Block.locate` +
# v2/v3/v3.1 internal parsers, and emits one JSON line per
# input. Mirrored byte-for-byte by `tools/sig-eval-rust`.
[[lean_exe]]
name = "sig-eval"
root = "Apkaxiom.Tv.SigEval"
supportInterpreter = true

# P1.12 — CDR evaluator binary; mirrors `tools/cdr-eval-rust`.
[[lean_exe]]
name = "cdr-eval"
root = "Apkaxiom.Tv.CdrEval"
supportInterpreter = true

# P1.12 — whole-archive (Consistency) evaluator; mirrors
# `tools/archive-eval-rust`.
[[lean_exe]]
name = "archive-eval"
root = "Apkaxiom.Tv.ArchiveEval"
supportInterpreter = true
