# APKAXIOM third-party Rust manifest
#
# This is the *single source of truth* for every Rust crate that enters the
# Buck2 build graph from outside the workspace. Cargo and Reindeer both read
# this file:
#   - Cargo (via the patch.crates-io override below) keeps `cargo build`
#     working at the workspace root for IDE / fast-iteration paths.
#   - Reindeer (`reindeer buckify`) uses it to generate
#     `third-party/rust/BUCK`, which Buck2 consumes for hermetic builds.
#
# Adding a new crate: bump the version here, run `make third-party`, commit
# the regenerated `BUCK`, `Cargo.lock`, and `vendor/` tree.

[workspace]

[package]
name = "apkaxiom-third-party"
version = "0.0.0"
edition = "2021"
publish = false

# Dummy binary to keep `cargo` happy on this manifest. Never built or run.
[[bin]]
name = "top"
path = "top/main.rs"

[dependencies]
# `thiserror` exercises Reindeer + Buck2 third-party correspondence (it
# has a proc-macro derive, so it stresses both the rlib and proc-macro
# paths).
thiserror = "1.0"
# `syn` powers tools/unsafe-census — replaces the regex approximation
# of `unsafe` block counting with a real AST visitor. `walkdir` is the
# directory traversal companion. We deliberately do NOT pull serde or
# serde_json here: Reindeer's buildscript runner does not pass
# CARGO_PKG_VERSION_PATCH, which serde_core's build.rs requires. The
# tool emits JSON via std::fmt::Write — sufficient for our output
# shape.
syn = { version = "2", features = ["parsing", "full", "visit"] }
walkdir = "2"
# P1.8: APKAXIOM ingests real APKs through axiom-l1-rs::Apk<S>;
# the manifest, signing carrier, and resources entries are
# uniformly DEFLATE-compressed. miniz_oxide is the minimal-deps
# inflater (pulls only adler2 for Adler-32). The wrapper's magic
# probes (looks_like_axml / looks_like_arsc / looks_like_pkcs7_der)
# run on the inflated bytes. Pinned to 0.8 — `make third-party`
# keeps the vendored tree in lock-step.
miniz_oxide = "0.8"
# P1.9 §V item 16 — cross-check the inline FIPS-180-4 SHA-256
# implementation against RustCrypto's audited `sha2` crate.
sha2 = { version = "0.10", default-features = false }

[patch.crates-io]
