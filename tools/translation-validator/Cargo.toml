[package]
name = "translation-validator"
description = "P1.9 translation-validator. Runs the Lean `lfh-eval` binary and the Rust `lfh-eval-rust` binary over the LFH corpus, asserts byte-identical JSON output line-for-line. Fail-closed CI gate."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "translation-validator"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }

[dev-dependencies]
# P1.9 §V item 16 — cross-check the inline FIPS-180-4 SHA-256
# implementation against the RustCrypto crate.
sha2 = { version = "0.10", default-features = false }

[lints]
workspace = true
