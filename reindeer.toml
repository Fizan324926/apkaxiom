##
## APKAXIOM Reindeer Config — root-level
##
## Reindeer reads the third-party Cargo manifest beneath `third_party_dir`
## and emits Buck2 targets into the same dir's BUCK file. The resulting
## `//third-party/rust:<crate>` targets are consumed by our crate BUCK files
## (currently just `crates/axiom-ir/BUCK`).
##
## Regenerate with:
##   make third-party
## or directly:
##   reindeer --third-party-dir=third-party/rust buckify
##

third_party_dir = "third-party/rust"

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
generated_file_header = """
##
## @generated by reindeer
## Do not edit by hand.
##
## To regenerate: `make third-party` (see Makefile).
##
"""

# Vendored crates land in third-party/rust/vendor. They are committed to git
# so the build is hermetic — `cargo` and `buck2` both resolve from the local
# vendor tree without hitting crates.io.
[vendor]
# By default reindeer re-checksums every vendored file; we disable that for a
# small set of helper artifacts that are intentionally regenerated at build
# time. (Empty list today; populated as the dep graph grows.)
gitignore_checksum_exclude = []
checksum_exclude = []
