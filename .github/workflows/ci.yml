#
# APKAXIOM CI — Phase 1.1 hermetic build gate.
#
# Per PR, every push, every nightly: build + test + reproducibility-verify on
# all supported host platforms, plus the supply-chain and drift-detection
# gates that turn P1.1 from "we built twice and it matched" into
# "every artefact is signed, attested, SBOM-bearing, and policy-clean".
#
# The matrix is:
#   - ubuntu-24.04         (linux x86_64)
#   - ubuntu-24.04-arm     (linux aarch64)
#   - macos-14             (darwin arm64; aka Apple Silicon)
#
# The build wall-time budget is 25 min p99 per K10 (PHASE_GATES.md §5).
# `wall-time-rollup.yml` (separate workflow) computes the p99 nightly.
#
# Jobs (see CONTRIBUTING.md §4 for the contract):
#   build (matrix x6)              — build, test, repro-check, verify-hashes
#   cross-runner-determinism       — diffs runner1 vs runner2 per platform
#   lint                           — cargo fmt + clippy
#   bazel-probe                    — `bazel info` against external/aosp/
#   graph-parity                   — Cargo ↔ Reindeer lockfile parity (ADR-0010)
#   reindeer-idempotence           — `make third-party` is a no-op
#   audit-toolchains-drift         — committed Buck2 toolchain snapshot diff
#   determinism-lint               — regex scan for nondeterminism patterns
#   security-audit                 — cargo-audit (workspace + third-party)
#   license-check                  — cargo-deny policy
#   sbom                           — CycloneDX (cargo-cyclonedx + syft + merge)
#   attest                         — SLSA L1 provenance via attest-build-provenance
#   sign-hashes                    — cosign keyless signing of hash files
#                                    (runs only on push to main, not on PRs)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly soak run at 04:17 UTC.
    - cron: "17 4 * * *"

permissions:
  contents: read
  # `attest-build-provenance` and `cosign sign-blob` need the OIDC token.
  # We keep `id-token: write` at workflow level rather than per-job because
  # multiple jobs need it; the CODEOWNERS gate stops untrusted PRs from
  # reaching `main`.
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: "315532800"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  # -------------------------------------------------------------------------
  # 1) Build, test, repro-check, snapshot per platform.
  #    Two runners per platform feed the cross-runner-determinism job.
  # -------------------------------------------------------------------------
  build:
    name: build (${{ matrix.platform }} / runner ${{ matrix.runner_id }})
    timeout-minutes: 25  # K10 hard gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     platform: linux-x86_64,  runner_id: 1 }
          - { os: ubuntu-24.04,     platform: linux-x86_64,  runner_id: 2 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, runner_id: 1 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, runner_id: 2 }
          - { os: macos-14,         platform: darwin-arm64,  runner_id: 1 }
          - { os: macos-14,         platform: darwin-arm64,  runner_id: 2 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Nix (Determinate)
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache Cargo registry + Buck2 outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            buck-out
          key: build-${{ matrix.platform }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'third-party/rust/Cargo.lock') }}
          restore-keys: |
            build-${{ matrix.platform }}-

      - name: Sanity — flake check
        run: nix develop --command nix flake check

      - name: Build (Buck2 //:all)
        run: nix develop --command make build

      - name: Test (Buck2 rust_test targets)
        run: nix develop --command make test

      - name: Local determinism (make repro-check)
        run: nix develop --command make repro-check

      - name: Verify against committed reference hashes
        run: nix develop --command make verify-hashes

      - name: Snapshot for cross-runner diff
        run: |
          nix develop --command bash scripts/hash-snapshot.sh
          # Strip the timestamp/headers so cross-runner diffs are stable.
          grep -vE '^#' "docs/phase-1/P1.1/reproducibility-hashes.${{ matrix.platform }}.txt" \
            | sort -u > "snapshot-${{ matrix.platform }}-${{ matrix.runner_id }}.txt"

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.platform }}-${{ matrix.runner_id }}
          path: snapshot-${{ matrix.platform }}-${{ matrix.runner_id }}.txt
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 2) Verify byte-identical hashes across two independent runners of each
  #    platform. This is the meaningful version of the spec's intent —
  #    same platform, different host, identical artifacts.
  # -------------------------------------------------------------------------
  cross-runner-determinism:
    name: cross-runner determinism
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download all snapshots
        uses: actions/download-artifact@v4
        with:
          path: snapshots

      - name: Diff per-platform pairs
        run: |
          set -euo pipefail
          fail=0
          for platform in linux-x86_64 linux-aarch64 darwin-arm64; do
            a="snapshots/snapshot-${platform}-1/snapshot-${platform}-1.txt"
            b="snapshots/snapshot-${platform}-2/snapshot-${platform}-2.txt"
            if [[ ! -f "$a" || ! -f "$b" ]]; then
              echo "::warning::missing snapshot for $platform; skipping"
              continue
            fi
            if diff -u "$a" "$b"; then
              echo "PASS: $platform — runners produced byte-identical hashes"
            else
              echo "FAIL: $platform — runners diverged"
              fail=1
            fi
          done
          exit "$fail"

  # -------------------------------------------------------------------------
  # 3) Cargo lint pass — clippy + cargo fmt --check + determinism-lint.
  # -------------------------------------------------------------------------
  lint:
    name: lint (cargo fmt + clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command make lint

  determinism-lint:
    name: determinism-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command make determinism-lint

  # -------------------------------------------------------------------------
  # 4) Bazel sub-workspace probe.
  # -------------------------------------------------------------------------
  bazel-probe:
    name: bazel sub-workspace probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command make bazel-info

  # -------------------------------------------------------------------------
  # 4b) Lean bring-up (P1.2). Per-platform, ≤10-min hard cap (spec §9).
  #     Builds Apkaxiom.{Hello,MathlibProbe}, runs the extractor, tests
  #     the extracted crate, and runs the translation-validator on a
  #     fixed input set.
  # -------------------------------------------------------------------------
  lean-bringup:
    name: lean-bringup (${{ matrix.platform }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     platform: linux-x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { os: macos-14,         platform: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: true }
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Cache Lake's `.lake/` package mirror + olean tree
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ matrix.platform }}-${{ hashFiles('lakefile.toml', 'lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            lake-${{ matrix.platform }}-
      - name: Lake build (Apkaxiom incl. MathlibProbe)
        run: nix develop --command lake build Apkaxiom
      - name: Buck2 //theorems:hello (olean manifest)
        run: nix develop --command buck2 build //theorems:hello
      - name: Run extractor (idempotent)
        run: |
          nix develop --command buck2 run //tools/lean-to-rust -- \
            theorems/Apkaxiom/Hello.lean \
            crates/axiom-extract-hello/src/lib.rs
      - name: Assert extracted lib.rs is unchanged (idempotent)
        run: |
          if ! git diff --exit-code crates/axiom-extract-hello/src/lib.rs; then
            echo "::error::extractor produced a diff against the committed lib.rs — re-run \`buck2 run //tools/lean-to-rust\` locally and commit." >&2
            exit 1
          fi
      - name: Test the extracted crate
        run: nix develop --command buck2 test //crates/axiom-extract-hello:axiom-extract-hello-test
      - name: Translation validator (Lean ↔ Rust on fixed inputs)
        run: nix develop --command buck2 run //tools/translation-validator

  # -------------------------------------------------------------------------
  # 4c) P1.3 drift gates. Re-run the audit and assert it produces the
  #     committed `audit-data/`; assert the recursive sha256 of the
  #     vendored upstream tree matches the committed value. Either
  #     drift would silently invalidate every audit-derived claim.
  #     Skips perf/correctness because they require a 100-APK corpus
  #     not present on the runner; everything else (identity, tokei,
  #     cargo-audit, unsafe-census, public-api, deps, summary) IS
  #     deterministic.
  # -------------------------------------------------------------------------
  p13-audit-drift:
    name: p13-audit-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: true }
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Re-run scripts/p13-audit.sh
        # P13_APK_CORPUS=/nonexistent skips the perf/correctness paths
        # which need real APKs. Everything else still runs.
        run: P13_APK_CORPUS=/nonexistent nix develop --command bash scripts/p13-audit.sh
      - name: Assert audit-data has not drifted
        run: |
          if ! git diff --exit-code \
              docs/phase-1/P1.3/audit-data/identity.json \
              docs/phase-1/P1.3/audit-data/tokei.json \
              docs/phase-1/P1.3/audit-data/cargo-audit.json \
              docs/phase-1/P1.3/audit-data/unsafe-census.json \
              docs/phase-1/P1.3/audit-data/public-api.json \
              docs/phase-1/P1.3/audit-data/deps.json \
              docs/phase-1/P1.3/audit-data/upstream-tree-sha256.txt; then
            echo "::error::audit-data drift detected — re-run \`make p13-audit\` locally with the F-Droid corpus and commit the diff."
            exit 1
          fi

  apk-info-upstream-pin:
    name: apk-info-upstream-pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recompute upstream-tree-sha256 and diff
        run: |
          set -euo pipefail
          actual=$(cd external/apk-info-upstream && \
            find . -type f \
                  -not -path './target/*' \
                  -not -path './.lake/*' \
                  -not -path './.git/*' \
                  -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          expected=$(cat docs/phase-1/P1.3/audit-data/upstream-tree-sha256.txt)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::upstream tree sha drift: expected $expected, got $actual"
            echo "Either someone modified files under external/apk-info-upstream/ (which is read-only audit input)" >&2
            echo "or the pinned SHA in external/apk-info-pinned-sha.txt was bumped without re-baking audit-data/." >&2
            exit 1
          fi
          echo "PASS: upstream tree matches committed sha $expected"

  # -------------------------------------------------------------------------
  # 5) Drift-detection gates (cheap, run early, parallel with build).
  # -------------------------------------------------------------------------
  graph-parity:
    name: graph-parity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: true }
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command make graph-parity
      - name: Upload graph-parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-parity-report
          path: target/graph-parity.json
          if-no-files-found: ignore

  reindeer-idempotence:
    name: reindeer-idempotence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: true }
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Install reindeer
        run: nix develop --command cargo install --locked --git https://github.com/facebookincubator/reindeer reindeer
      - run: nix develop --command make reindeer-check

  audit-toolchains-drift:
    name: audit-toolchains-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: true }
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Re-run audit-toolchains
        run: nix develop --command make audit-toolchains
      - name: Diff against committed snapshot
        run: |
          if ! git diff --exit-code docs/phase-1/P1.1/audit-toolchains.txt \
                                    docs/phase-1/P1.1/audit-toolchains.json; then
            echo "::error::Buck2 toolchain snapshot drift detected. Re-run \`make audit-toolchains\` and commit the diff." >&2
            exit 1
          fi

  # -------------------------------------------------------------------------
  # 6) Supply-chain gates.
  # -------------------------------------------------------------------------
  security-audit:
    name: security-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: true }
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command make security-audit
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: |
            target/security-audit.workspace.json
            target/security-audit.third-party.json
          if-no-files-found: ignore

  license-check:
    name: license-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: true }
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command make license-check
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-check
          path: target/license-check.jsonl
          if-no-files-found: ignore

  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: true }
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command make sbom
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            target/sbom-cargo.cdx.json
            target/sbom-syft.cdx.json
            target/sbom-merged.cdx.json
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 7) Provenance + signing — only on push to main, not on PRs (PRs from
  #    forks lack id-token write).
  # -------------------------------------------------------------------------
  attest:
    name: attest (slsa l1 provenance)
    needs: [build, sbom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom
      - name: Download all snapshots
        uses: actions/download-artifact@v4
        with:
          path: artifacts/snapshots
      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            artifacts/sbom/sbom-merged.cdx.json
            artifacts/snapshots/**/*.txt

  sign-hashes:
    name: sign-hashes (cosign keyless)
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: true }
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Sign every committed reproducibility-hashes file
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: nix develop --command make sign-hashes
      - name: Upload signatures + bundles
        uses: actions/upload-artifact@v4
        with:
          name: hash-signatures
          path: |
            docs/phase-1/P1.1/reproducibility-hashes.*.{sig,cert,bundle}
          if-no-files-found: error
