name: P1.14 cross-version + classifier

on:
  push:
    branches: [main]
    paths:
      - 'fuzz/harness/**'
      - 'fuzz/classifier/**'
      - 'fuzz/orchestrator/**'
      - 'fuzz/corpus-archive/**'
      - 'fuzz/cve-template/**'
      - 'fuzz/dashboards/grafana-cross-version.json'
      - 'docs/phase-1/P1.14/**'
      - '.github/workflows/p114.yml'
  pull_request:
    paths:
      - 'fuzz/harness/**'
      - 'fuzz/classifier/**'
      - 'fuzz/orchestrator/**'
      - 'fuzz/corpus-archive/**'
      - 'fuzz/cve-template/**'

jobs:
  p114:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq python3 build-essential cmake ninja-build clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.runner }}-cargo-p114-${{ hashFiles('Cargo.lock') }}

      - name: Build axiom-l0-zip-verified + AOSP runtime probe
        run: |
          make p13 || true
          make p16-aosp-runtime-probe

      - name: Run lib tests (P1.13 + P1.14)
        run: cargo test --release -p p113-fuzz-harness -p p114-classifier -p p114-orchestrator -p p114-corpus-archive --lib

      - name: Cross-version fuzz (3 000 iters, synthetic A8/A11/A14)
        run: make p114-fuzz

      - name: Classify the archive
        run: make p114-classify

      - name: HARD gate — classifier micro-precision >= 0.80
        run: make p114-classify-eval

      - name: 4-worker pool smoke run
        run: make p114-orchestrate

      - name: HARD gate — at least one CVE draft generated
        run: make p114-cve-template-smoke

      - name: Validate cross-version Grafana dashboard JSON
        run: make p114-dashboard-validate
