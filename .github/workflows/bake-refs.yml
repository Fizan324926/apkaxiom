#
# bake-refs.yml — manually-dispatched workflow that bakes the canonical
# `reproducibility-hashes.<plat>.txt` reference for every CI platform on
# *two independent runners*, asserts byte-equality between the runners
# before commit, and opens a draft PR with the new files.
#
# Use this workflow whenever a controlled build-input change shifts the
# canonical hashes — toolchain bump, flake.lock bump, dep update, etc.
# Per ADR-0004, every bake is paired with an ADR review.
#
# How it differs from `ci.yml`'s normal `build` job:
#   - Two runners per platform are *required* (the built-in matrix gates
#     on byte-equality). One runner is a probe; two prove cross-runner
#     determinism on the new reference.
#   - The output goes to a draft PR, not to the failing-step log.
#   - Only G13 leads can dispatch (enforced via repo permissions).

name: bake-refs

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are we re-baking? (links to ADR or bump)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  SOURCE_DATE_EPOCH: "315532800"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  bake:
    name: bake (${{ matrix.platform }} / runner ${{ matrix.runner_id }})
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04,     platform: linux-x86_64,  runner_id: 1 }
          - { os: ubuntu-24.04,     platform: linux-x86_64,  runner_id: 2 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, runner_id: 1 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, runner_id: 2 }
          - { os: macos-14,         platform: darwin-arm64,  runner_id: 1 }
          - { os: macos-14,         platform: darwin-arm64,  runner_id: 2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: true }
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Bake hashes for this platform
        run: nix develop --command make hash-snapshot
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: bake-${{ matrix.platform }}-${{ matrix.runner_id }}
          path: docs/phase-1/P1.1/reproducibility-hashes.${{ matrix.platform }}.txt
          if-no-files-found: error

  reconcile:
    name: reconcile + open PR
    needs: [bake]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all bake candidates
        uses: actions/download-artifact@v4
        with:
          path: candidates

      - name: Verify per-platform byte-equality across runners
        run: |
          set -euo pipefail
          for platform in linux-x86_64 linux-aarch64 darwin-arm64; do
            a="candidates/bake-${platform}-1/reproducibility-hashes.${platform}.txt"
            b="candidates/bake-${platform}-2/reproducibility-hashes.${platform}.txt"
            # Strip headers (timestamps, runner identity) before comparison.
            if ! diff -u <(grep -vE '^#' "$a" | sort -u) \
                        <(grep -vE '^#' "$b" | sort -u); then
              echo "::error::FATAL: $platform runners disagree. Refusing to bake a stale reference." >&2
              exit 1
            fi
            echo "PASS: $platform — runners agree."
          done

      - name: Stage final references (runner-1 wins; we already proved equality)
        run: |
          set -euo pipefail
          for platform in linux-x86_64 linux-aarch64 darwin-arm64; do
            cp "candidates/bake-${platform}-1/reproducibility-hashes.${platform}.txt" \
               "docs/phase-1/P1.1/reproducibility-hashes.${platform}.txt"
          done

      - name: Open draft PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bake-refs/${{ github.run_id }}
          base: main
          draft: true
          commit-message: |
            P1.1: re-bake reproducibility-hashes references

            Reason: ${{ inputs.reason }}

            Generated by .github/workflows/bake-refs.yml on run ${{ github.run_id }}.
            Cross-runner byte-equality verified per ADR-0007.
          title: "P1.1: re-bake reproducibility-hashes references"
          body: |
            ## Reason

            ${{ inputs.reason }}

            ## Source

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## What this PR does

            - Bakes `reproducibility-hashes.{linux-x86_64,linux-aarch64,darwin-arm64}.txt` against two independent runners per platform.
            - Cross-runner byte-equality verified before commit (per ADR-0007).
            - Draft until a G13 reviewer signs off (per CODEOWNERS).

            ## Reviewer checklist

            - [ ] Reason is tied to an ADR change (toolchain bump, dep bump, etc.).
            - [ ] CI on this PR passes (verify-hashes will exercise the new references).
            - [ ] CORPUS_ROOT line for each platform matches expectations.
          labels: |
            P1.1
            hermetic-build
            review-required
