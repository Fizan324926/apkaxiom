#
# wall-time-rollup.yml — nightly job that pulls the last 200 CI runs from
# the GitHub Actions API, appends per-job wall-time samples to
# docs/phase-1/P1.1/wall-time.ndjson, regenerates the Markdown rollup,
# and commits the updated files.
#
# This is the K10 telemetry that turns "build wall time ≤ 25 min p99"
# from an aspirational gate into a measured invariant.

name: wall-time-rollup

on:
  schedule:
    - cron: "23 5 * * *"  # 05:23 UTC, after the nightly CI soak.
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  rollup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with: { determinate: true }
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Roll up wall-time samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop --command make wall-time-rollup
      - name: Commit updated rollup
        run: |
          set -euo pipefail
          if git diff --quiet docs/phase-1/P1.1/wall-time*; then
            echo "No new samples; nothing to commit."
            exit 0
          fi
          git config user.name  "apkaxiom-bot"
          git config user.email "noreply@apkaxiom.dev"
          git add docs/phase-1/P1.1/wall-time.ndjson docs/phase-1/P1.1/wall-time-rollup.md
          git commit -s -m "P1.1: nightly wall-time rollup ($(date -u +%Y-%m-%d))" \
            -m "Generated by .github/workflows/wall-time-rollup.yml. K10 gate is the rollup table." \
            -m "Signed-off-by: apkaxiom-bot <noreply@apkaxiom.dev>"
          git push
