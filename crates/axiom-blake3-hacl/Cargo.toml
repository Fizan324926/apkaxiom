[package]
name = "axiom-blake3-hacl"
description = "P1.10 — verified-crypto hashing for APKAXIOM. Production BLAKE3 via the official BLAKE3-team Rust crate; verified-baseline BLAKE2b via HACL* (F*-verified). ADR-0028 in docs/phase-1/P1.10/ documents the honest spec deviation: HACL* does not ship F*-verified BLAKE3, only BLAKE2b/BLAKE2s."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Production BLAKE3 — official BLAKE3-team reference Rust impl.
blake3 = { version = "=1.5.5", default-features = false, features = ["pure"] }

[lints]
workspace = true
