[package]
name = "axiom-l1-signing-verified"
description = "APK signing verifier with HACL*-backed crypto on the critical path. Delegates structural parsing + scheme dispatch to axiom-sigverify; uses axiom-crypto-hacl (libcrux) for the SHA-256 chunked digest computation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
axiom-crypto-hacl = { path = "../axiom-crypto-hacl" }
axiom-sigverify = { path = "../axiom-sigverify" }
axiom-sigblock = { path = "../axiom-sigblock" }
axiom-l1-rs = { path = "../axiom-l1-rs" }
# RSA-PKCS1-SHA512 signature verification (not wired in axiom-sigverify).
rsa = { version = "=0.9.7", default-features = false, features = ["sha2"] }
sha2 = { version = "0.10", default-features = false }

[lints]
workspace = true
