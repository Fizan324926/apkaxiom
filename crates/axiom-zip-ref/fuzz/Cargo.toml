[package]
name = "axiom-zip-ref-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.axiom-zip-ref]
path = ".."

[dependencies.axiom-l0-zip-lfh-extracted]
path = "../../axiom-l0-zip-lfh-extracted"

# Each fuzz target is its own binary. libFuzzer drives them via
# `cargo +nightly fuzz run <target>`. The targets exist to give the
# coverage-guided fuzzer entry points; the in-tree crate already
# `forbid(unsafe_code)` so the panic mode is the only failure
# signal we care about.

[[bin]]
name = "fuzz_parse_lfh"
path = "fuzz_targets/fuzz_parse_lfh.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_eocd"
path = "fuzz_targets/fuzz_parse_eocd.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_cdr"
path = "fuzz_targets/fuzz_parse_cdr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_archive"
path = "fuzz_targets/fuzz_parse_archive.rs"
test = false
doc = false
bench = false

# P1.9 §V item 9 — differential fuzz between hand-Rust and
# auto-extracted Rust. Both call `parse_lfh` on the same input
# and assert byte-equivalent results. Any divergence is a real
# bug in either the extractor or the hand-Rust implementation.
[[bin]]
name = "fuzz_parse_lfh_differential"
path = "fuzz_targets/fuzz_parse_lfh_differential.rs"
test = false
doc = false
bench = false
