[package]
name = "axiom-sigverify"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axiom-sigblock = { path = "../axiom-sigblock" }
miniz_oxide = "0.8"
# Force base64ct < 1.7 (newer requires edition2024). Listed
# explicitly so every transitive resolver picks 1.6.x.
base64ct = "=1.6.0"
sha2 = { version = "0.10", default-features = false }
sha1 = { version = "=0.10.6", default-features = false, features = ["oid"] }
rsa = { version = "=0.9.7", default-features = false, features = ["sha2"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "pem", "pkcs8"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["pkcs8"] }
x509-cert = { version = "=0.2.5", default-features = false, features = ["pem"] }
spki = { version = "=0.7.3", default-features = false, features = ["alloc"] }
pkcs8 = { version = "=0.10.2", default-features = false, features = ["alloc"] }
der = { version = "=0.7.9", default-features = false, features = ["alloc", "oid"] }
cms = { version = "=0.2.3", default-features = false, features = ["builder"] }
const-oid = { version = "=0.9.6", default-features = false }
thiserror.workspace = true

[lints]
workspace = true
