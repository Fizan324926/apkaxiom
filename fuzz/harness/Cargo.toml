[package]
name = "p113-fuzz-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "p113-fuzz-driver"
path = "src/main.rs"

[[bin]]
name = "p113-fuzz-replay"
path = "src/bin/replay.rs"

[[bin]]
name = "p113-fuzz-dedupe"
path = "src/bin/dedupe.rs"

[[bin]]
name = "p113-fuzz-grammar-gen"
path = "src/bin/grammar_gen.rs"

[[bin]]
name = "p113-afl-harness"
path = "src/bin/afl_harness.rs"

[[bin]]
name = "p114-realapk-eval"
path = "src/bin/realapk_eval.rs"

[[bin]]
name = "p114-fuzz-replay"
path = "src/bin/replay_xv.rs"

[features]
# Real-mode KVM/Nyx harness path. Disabled by default — building it
# requires libnyx + a /dev/kvm host. Dev mode (default) runs the
# whole pipeline in-process against the AOSP libziparchive runtime
# probe, which proves the classifier + finding archive end-to-end
# without KVM. ADR-0031 records the split.
default = []
nyx-cuttlefish = []

[dependencies]
axiom-l0-zip-verified = { path = "../../crates/axiom-l0-zip-verified" }
axiom-blake3-hacl = { path = "../../crates/axiom-blake3-hacl" }
# Real SIGINT/SIGTERM handler (Gap-17 closure). The user-facing
# API is unsafe-clean; the `unsafe` is sealed inside
# `signal-hook-registry`. We use the iterator API
# `Signals::forever()` from a dedicated thread.
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"] }

[lints]
workspace = true
