[workspace]
resolver = "2"
members = [
    "crates/axiom-blake3-hacl",
    "crates/axiom-l0",
    "crates/axiom-l0-zip-lfh-extracted",
    "crates/axiom-l0-zip-lfh-verified",
    "crates/axiom-l0-zip-verified",
    "crates/axiom-l1-rs",
    "crates/axiom-sigblock",
    "crates/axiom-sigverify",
    "crates/axiom-ir",
    "crates/axiom-extract-hello",
    "crates/axiom-zip-ref",
    "tools/ir-corpus",
    "tools/ir-schema-check",
    "tools/lean-to-rust",
    "tools/translation-validator",
    "tools/unsafe-census",
    "tools/zip-corpus-gen",
    "tools/zip-differential",
    "tools/zip-fuzz",
    "tools/zip-stream-bench",
    "tools/zip-stream-soak",
    "tools/p17-bench-1k",
    "tools/p18-perf-delta",
    "tools/eocd-eval-rust",
    "tools/cdr-eval-rust",
    "tools/archive-eval-rust",
    "tools/lfh-eval-extracted",
    "tools/tv-schema-check",
    "tools/lfh-eval-rust",
    "tools/p110-hash-throughput",
    "tools/p110-merkle-perf-delta",
    "tools/p110-tamper-fuzz",
    "tools/sig-eval-rust",
    "tools/p111-differential",
    "tools/p111-tamper-fuzz",
    "tools/p19-perf-delta",
    "tools/p112-bench-10k",
    "tools/p112-perf-delta",
    "tools/p112-throughput",
    "tools/p112-latency",
    "tools/p112-commit-chain",
]
# `third-party/rust` is its own workspace (Reindeer-managed). Excluding it
# here prevents Cargo from spuriously trying to merge the two workspaces.
# `external/apk-info-upstream` is a P1.3 audit input — read-only clone of
# the upstream parser, deliberately outside our build graph.
exclude = [
    "third-party/rust",
    "external/aosp",
    "external/apk-info-upstream",
    "external/libziparchive",
    # cargo-fuzz workspace — own Cargo.toml + libfuzzer-sys dep that
    # lives outside Reindeer. Driven by `cargo +nightly fuzz run …`
    # from inside the dev shell; not part of the buck2 / cargo build.
    "crates/axiom-zip-ref/fuzz",
    "crates/axiom-l1-rs/fuzz",
    # Glommio io_uring soak — pulls glommio + transitive deps that
    # live outside the Reindeer set. Driven via
    # `cargo --manifest-path tools/zip-stream-soak-async/Cargo.toml`
    # from inside `nix develop`.
    "tools/zip-stream-soak-async",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false
rust-version = "1.83"
authors = ["APKAXIOM Authors"]
repository = "https://github.com/Fizan324926/apkaxiom"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
thiserror = "1.0"
syn = { version = "2", default-features = false, features = ["parsing", "full", "visit"] }
walkdir = "2"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"
debug = 0
incremental = false
overflow-checks = true

[profile.dev]
incremental = false
